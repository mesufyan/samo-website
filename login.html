<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#E07A5F">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <title>Sign in — SAMO</title>
  <meta name="robots" content="noindex">
</head>
<body>
  <div id="siteHeader"></div>

  <main class="page">
    <div class="wrap wrap--narrow">
      <div class="auth-card">
        <h1 class="h1">Sign in</h1>
        <p class="lede">Welcome back.</p>

        <form id="loginForm" class="card" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" class="input" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" class="input" autocomplete="current-password" required>
          </div>
          <div class="field">
            <label class="check">
              <input type="checkbox" id="remember" checked>
              <span>Keep me signed in on this device</span>
            </label>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Sign in</button>
        </form>

        <p class="auth-alt">No account yet? <a href="signup.html">Create one</a></p>
      </div>
    </div>
  </main>

  <div id="siteFooter"></div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/backend.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
